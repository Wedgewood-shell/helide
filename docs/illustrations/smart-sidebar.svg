<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Smart sidebar collapse</title>
  <desc id="desc">A browser window wider than 65% of the screen shows the vertical tab strip with titles. When the window is made narrower than that, the strip collapses to icons. A three-finger swipe over the collapsed strip shows a glowing pill with the tab's title, growing out of the strip over the page.</desc>
  <defs>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-20%" y="-60%" width="140%" height="220%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter>
    <style>
      text{font-family:system-ui,sans-serif;fill:#D5D6DB}.small{font-size:11px;fill:#787C99}.tab{font-size:12px}
      .wide{animation:wide 9s ease-in-out infinite}
      .narrow{opacity:0;animation:narrow 9s ease-in-out infinite}
      .pill{opacity:0;animation:pill 9s ease-in-out infinite}
      .label-a{animation:label-a 9s ease-in-out infinite}
      .label-b{opacity:0;animation:label-b 9s ease-in-out infinite}
      @keyframes label-a{0%,58%{opacity:1}64%,100%{opacity:0}}
      @keyframes label-b{0%,72%{opacity:0}78%,100%{opacity:1}}
      .hint-a{animation:hint-a 9s ease-in-out infinite}
      .hint-b{opacity:0;animation:hint-b 9s ease-in-out infinite}
      .hint-c{opacity:0;animation:hint-c 9s ease-in-out infinite}
      @keyframes wide{0%,28%{opacity:1}34%,94%{opacity:0}100%{opacity:1}}
      @keyframes narrow{0%,28%{opacity:0}34%,94%{opacity:1}100%{opacity:0}}
      @keyframes pill{0%,50%{opacity:0;transform:translateY(0)}56%{opacity:1;transform:translateY(0)}78%,86%{opacity:1;transform:translateY(64px)}92%,100%{opacity:0;transform:translateY(64px)}}
      @keyframes hint-a{0%,28%{opacity:1}32%,96%{opacity:0}100%{opacity:1}}
      @keyframes hint-b{0%,30%{opacity:0}34%,48%{opacity:1}52%,100%{opacity:0}}
      @keyframes hint-c{0%,50%{opacity:0}54%,92%{opacity:1}96%,100%{opacity:0}}
      @media(prefers-reduced-motion:reduce){.motion{animation:none!important}.wide{opacity:0}.narrow{opacity:1}.pill{opacity:1;transform:translateY(64px)}.label-a{opacity:0}.label-b{opacity:1}.hint-a,.hint-b{opacity:0}.hint-c{opacity:1}}
    </style>
  </defs>
  <rect width="720" height="260" rx="16" fill="#0e1017"/>
  <text x="28" y="28" class="small" letter-spacing="2">SMART SIDEBAR COLLAPSE</text>

  <!-- the screen, with the 65% mark -->
  <rect x="64" y="44" width="592" height="6" rx="3" fill="#24283B"/>
  <rect x="64" y="44" width="385" height="6" rx="3" fill="#444B6A"/>
  <path d="M449 38V228" stroke="#E0AF68" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>
  <text x="455" y="60" class="small" style="fill:#E0AF68">65% OF THE SCREEN</text>

  <!-- wide window: the strip shows titles -->
  <g class="wide motion">
    <rect x="64" y="62" width="520" height="150" rx="12" fill="#24283B" stroke="#444B6A"/>
    <path d="M184 62V212" stroke="#444B6A"/>
    <rect x="200" y="80" width="300" height="8" rx="4" fill="#444B6A"/>
    <rect x="200" y="100" width="220" height="6" rx="3" fill="#444B6A" opacity=".6"/>
    <rect x="200" y="116" width="260" height="6" rx="3" fill="#444B6A" opacity=".6"/>
    <rect x="72" y="102" width="104" height="26" rx="8" fill="#444B6A"/>
    <g class="tab">
      <circle cx="86" cy="83" r="5" fill="#8698df"/><text x="98" y="87">Inbox</text>
      <circle cx="86" cy="115" r="5" fill="#41A6B5"/><text x="98" y="119">Docs</text>
      <circle cx="86" cy="147" r="5" fill="#F7768E"/><text x="98" y="151">Mail</text>
      <circle cx="86" cy="179" r="5" fill="#E0AF68"/><text x="98" y="183">Maps</text>
    </g>
  </g>

  <!-- narrow window: the strip collapses to icons -->
  <g class="narrow motion">
    <rect x="64" y="62" width="330" height="150" rx="12" fill="#24283B" stroke="#444B6A"/>
    <path d="M104 62V212" stroke="#444B6A"/>
    <rect x="120" y="80" width="230" height="8" rx="4" fill="#444B6A"/>
    <rect x="120" y="100" width="170" height="6" rx="3" fill="#444B6A" opacity=".6"/>
    <rect x="120" y="116" width="200" height="6" rx="3" fill="#444B6A" opacity=".6"/>
    <rect x="71" y="102" width="26" height="26" rx="8" fill="#444B6A"/>
    <circle cx="84" cy="83" r="5" fill="#8698df"/>
    <circle cx="84" cy="115" r="5" fill="#41A6B5"/>
    <circle cx="84" cy="147" r="5" fill="#F7768E"/>
    <circle cx="84" cy="179" r="5" fill="#E0AF68"/>
  </g>

  <!-- swiping over the collapsed strip: the glow grows into a pill with the title -->
  <g class="pill motion">
    <rect x="71" y="102" width="96" height="26" rx="8" fill="#8698df" opacity=".75" filter="url(#soft)"/>
    <rect x="71" y="102" width="96" height="26" rx="8" fill="#1a1d2b" filter="url(#shadow)"/>
    <rect x="71" y="102" width="96" height="26" rx="8" fill="#8698df" fill-opacity=".2" stroke="#8698df" stroke-width="1.5"/>
    <g class="label-a motion"><circle cx="84" cy="115" r="5" fill="#41A6B5"/><text x="102" y="119" class="tab">Docs</text></g>
    <g class="label-b motion"><circle cx="84" cy="115" r="5" fill="#E0AF68"/><text x="102" y="119" class="tab">Maps</text></g>
  </g>

  <text x="360" y="248" text-anchor="middle" class="small hint-a motion">WIDE: TITLES IN THE STRIP</text>
  <text x="360" y="248" text-anchor="middle" class="small hint-b motion" style="fill:#41A6B5">NARROW: THE STRIP COLLAPSES</text>
  <text x="360" y="248" text-anchor="middle" class="small hint-c motion" style="fill:#BB9AF7">SWIPE: TITLES GROW OUT OF IT</text>
</svg>
